name: Quality

on:
  push:
  pull_request:

jobs:
  quality:
    name: Quality (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [full, mvp]
    env:
      EXPO_PUBLIC_RELEASE_PROFILE: ${{ matrix.profile }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Generate Expo ambient types
        run: printf '%s\n' '/// <reference types="expo/types" />' > expo-env.d.ts

      - name: Run typecheck
        run: npm run typecheck

      - name: Run Jest
        run: npm test -- --runInBand
